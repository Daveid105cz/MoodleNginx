version: '2'
services:
  mariadb:
    image: mariadb:latest
    restart: always
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - MARIADB_USER=moodle_user
      - MARIADB_DATABASE=moodle
      - MARIADB_PASSWORD=password
      - MARIADB_ROOT_PASSWORD=password
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - /moodleTest/db/:/var/lib/mysql
  moodle:
    build: ./nginx/
    image: moodlenginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /moodleTest/data/:/moodledata/
      - /moodleTest/config.php:/var/www/html/config.php
      - /moodleTest/certs/:/certs/
      - /moodleTest/certBotChallenges/:/certChallenges/
      # - ./data/certbot/conf:/etc/letsencrypt
      # - ./data/certbot/www:/var/www/certbot
    depends_on:
      - mariadb
  redis:
    image: redis:latest
    restart: always
  cerbot:
    build: ./certbot/
    image: simplecertbot
    environment:
      - DOMAIN=moodle.oact.cz
      - EMAIL=davi.podeszwa@gmail.com
      - STAGING=
      - CRONS=50 * * * *
    volumes:
      - /moodleTest/certs/:/etc/letsencrypt
      - /moodleTest/certBotChallenges/:/var/www/certbot
    depends_on:
      - moodle
