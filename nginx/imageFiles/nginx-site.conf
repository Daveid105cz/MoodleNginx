server {

    listen 80 default_server;

    server_name _;

    location ~ /.well-known/acme-challenge/ {
        root /certChallenges;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    ssl_certificate     /certs/live/moodle.oact.cz/fullchain.pem;
    ssl_certificate_key /certs/live/moodle.oact.cz/privkey.pem;


    root /var/www/html;
    index index.php index.html index.htm index.nginx-debian.html;
    server_name _;



    error_page 404 /error/index.php;    error_page 403 =404 /error/index.php;

    location ~ /.well-known/acme-challenge/ {
        root /certChallenges;
    }

    location / {
            try_files $uri $uri/ =404;
    }
    location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info  ^(.+\.php)(/.+)$;
            fastcgi_index            index.php;
            fastcgi_pass unix:/var/run/php7.4-fpm.sock;
            include fastcgi_params;
            fastcgi_param   PATH_INFO  $fastcgi_path_info;
            fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ /\.(?!well-known).* {
        return 404;
    }
    
    location /dataroot/ {
        internal;
        alias /moodledata/;  #ensure the path ends with /
    }
    # This should be after the php fpm rule and very close to the last nginx ruleset.
    # Don't allow direct access to various internal files. See MDL-69333
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
        deny all;
        return 404;
    }
}